<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#fb923c" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#060913"/>
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="rgba(251, 146, 60, 0.35)" stroke-width="1"/>
  <!-- Multi-Agent Hexagon / Orbit Nexus -->
  <g filter="url(#glow)" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="16,6 25,11 25,21 16,26 7,21 7,11"/>
    <circle cx="16" cy="16" r="3" fill="#fb923c" stroke="none"/>
    <line x1="16" y1="6" x2="16" y2="13"/>
    <line x1="25" y1="21" x2="19" y2="18"/>
    <line x1="7" y1="21" x2="13" y2="18"/>
  </g>
</svg>

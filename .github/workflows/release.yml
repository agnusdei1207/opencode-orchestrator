name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test TypeScript
        run: |
          npm run build
          npm run test:coverage
          npm audit

      - name: Install Rust quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Check and test Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: orchestrator-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: orchestrator-linux-arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            binary: orchestrator-macos-x64
          - os: macos-26
            target: aarch64-apple-darwin
            binary: orchestrator-macos-arm64
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            binary: orchestrator-windows-x64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/orchestrator ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/orchestrator.exe ${{ matrix.binary }}

      - name: Validate Linux x64 artifact architecture
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          file ${{ matrix.binary }}
          file ${{ matrix.binary }} | grep -F "x86-64"

      - name: Validate Linux arm64 artifact architecture
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          file ${{ matrix.binary }}
          file ${{ matrix.binary }} | grep -F "ARM aarch64"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: [qa, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Require npm registry authentication
        if: env.NPM_TOKEN == ''
        run: |
          echo "::error::NPM_TOKEN secret is required for a complete public release."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Build publishable package
        run: npm run build

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: binaries

      - name: Display structure of downloaded files
        run: ls -R binaries/

      - name: Prepare binaries for NPM
        run: |
          mkdir -p bin
          rm -f bin/*
          cp binaries/orchestrator-linux-x64/orchestrator-linux-x64 bin/
          cp binaries/orchestrator-linux-arm64/orchestrator-linux-arm64 bin/
          cp binaries/orchestrator-macos-x64/orchestrator-macos-x64 bin/
          cp binaries/orchestrator-macos-arm64/orchestrator-macos-arm64 bin/
          cp binaries/orchestrator-windows-x64.exe/orchestrator-windows-x64.exe bin/
          chmod +x bin/*

      - name: Verify release artifacts
        run: node scripts/verify-release-artifacts.mjs

      - name: Smoke-test packed package
        run: node scripts/package-smoke.mjs

      - name: Configure npm auth
        if: env.NPM_TOKEN != ''
        run: |
          cat <<EOF > ~/.npmrc
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          EOF
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish to NPM Registry
        if: env.NPM_TOKEN != ''
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published to npm. Skipping."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: binaries/**/*
          body: |
            # OpenCode Orchestrator ${{ github.ref_name }}

            Release for OpenCode Orchestrator.

            ### Included
            * Four-agent OpenCode orchestration
            * Mission-loop continuation guards
            * Config and permission compatibility fixes
            * Cross-platform release binaries

            ## Install
            ```bash
            opencode plugin opencode-orchestrator --global
            ```
          generate_release_notes: true
          fail_on_unmatched_files: true
